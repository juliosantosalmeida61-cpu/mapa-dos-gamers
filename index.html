<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080d1c">
<title>LEVEL UP — Mapa dos Gamers</title>
<style>
:root {
  --bg:#080d1c; --panel:#111a30; --line:#2c4264;
  --mint:#72ffd0; --cyan:#70d7ff; --purple:#a78bfa;
  --gold:#ffd66b; --text:#f4f7ff; --muted:#aab8d3;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:75px}
body{
 margin:0;background:radial-gradient(ellipse at top,#1c3159,transparent 55%),var(--bg);
 color:var(--text);font:16px/1.5 system-ui,Arial,sans-serif
}
button,input,select{font:inherit}
button{
 cursor:pointer;border:0;border-radius:12px;padding:11px 15px;
 font-weight:800;color:#081323;background:linear-gradient(135deg,var(--mint),var(--cyan))
}
button:hover{filter:brightness(1.1)}
.secondary{background:#243451;color:white;border:1px solid #3b5276}
.wrap{max-width:1100px;margin:auto;padding:0 16px}
.hero{text-align:center;padding:35px 0 25px}
.brand{color:var(--mint);font-weight:900;letter-spacing:2px}
h1{font-size:clamp(40px,9vw,75px);line-height:1;margin:18px 0}
h1 span{background:linear-gradient(90deg,var(--mint),var(--cyan),var(--purple));color:transparent;background-clip:text}
p{color:var(--muted)}
.topbar{position:sticky;top:0;z-index:5;background:#080d1cf5;border-block:1px solid var(--line)}
nav{display:flex;gap:5px;overflow:auto;padding:9px 0}
nav button{background:transparent;color:white;white-space:nowrap;box-shadow:none}
nav button:hover{background:#1a2b47}
main{padding:18px 0 40px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.panel{grid-column:span 12;min-width:0;background:linear-gradient(150deg,#15223b,#0e172a);border:1px solid var(--line);border-radius:18px;padding:18px}
.half{grid-column:span 6}
.third{grid-column:span 4}
h2{font-size:1.2rem;margin:0 0 12px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.stat{background:#0c1527;border:1px solid var(--line);border-radius:13px;padding:12px}
.stat strong{display:block;font-size:1.5rem}
.stat span,.small{font-size:.8rem;color:var(--muted)}
.progress{height:10px;background:#293955;border-radius:20px;overflow:hidden;margin-top:8px}
.progress div{height:100%;background:linear-gradient(90deg,var(--mint),var(--cyan));width:0}
.field{display:grid;gap:5px;margin:10px 0}
.field input,.field select{width:100%;background:#091326;color:white;border:1px solid #354968;border-radius:10px;padding:12px}
.mapgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.region{min-height:95px;background:#172743;color:white;border:1px solid #3a5274;box-shadow:none;display:flex;flex-direction:column;align-items:center;justify-content:center}
.region .emoji{font-size:25px}
.region small{color:var(--muted);font-weight:400}
.region.visited{border-color:var(--mint);background:#163c3b}
.tile{background:#0d1729;border:1px solid #2d4263;border-radius:13px;padding:13px;margin:9px 0}
.tile h3{margin:0 0 4px;font-size:1rem}
.tile p{margin:5px 0;font-size:.9rem}
.reward{color:var(--gold);font-weight:900}
.option{display:block;width:100%;text-align:left;margin:8px 0;background:#1b2a45;color:white;border:1px solid #334c70;box-shadow:none}
.option:disabled{opacity:.65}
.badge{display:inline-block;background:#263858;border-radius:7px;padding:3px 8px;font-size:.75rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
